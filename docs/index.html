<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#232a37">
<title>Archivus</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png?v=4">
<link rel="apple-touch-icon" href="./icon-192.png?v=4">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<header><div class="bar"><button class="brand" id="home" type="button"><img src="./icon-192.png?v=4" alt="">Archivus</button><span id="sync" role="status">Conectando</span></div></header>
<main>
  <div class="intro">
    <p class="eyebrow">INVENTARIO AUDIOVISUAL</p>
    <h1 id="heading">Discos W Agencia</h1>
    <p id="summary">Organiza y encuentra el material de tu equipo.</p>
  </div>
  <div class="toolbar">
    <label class="search"><span class="sr">Buscar en el inventario</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Buscar discos o carpetas" maxlength="120"></label>
    <button id="add" class="primary" type="button" disabled>＋ Nuevo disco</button>
  </div>
  <nav id="path" aria-label="Ubicación" hidden></nav>
  <div class="section"><h2 id="section-title">Tus discos</h2><span id="count"></span></div>
  <div id="list"></div>
  <p id="notice" role="status"></p>
</main>
<dialog aria-labelledby="dialog-title">
  <form id="editor">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="Cerrar">×</button></div>
    <div id="fields"></div>
    <p id="error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" id="cancel">Cancelar</button><button class="primary" id="save" type="submit">Guardar</button></div>
  </form>
</dialog>
</body>
</html>
