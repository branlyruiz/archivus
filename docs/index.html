<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e20e17">
<title>Archivus</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png?v=6">
<link rel="apple-touch-icon" href="./icon-192.png?v=6">
<link rel="stylesheet" href="./style.css?v=21">
<script type="module" src="./app.js?v=21"></script>
</head>
<body>
<header><div class="bar"><button class="brand" id="home" type="button"><img src="./brand-w.png?v=6" alt="">Archivus</button><span id="sync" role="status">Conectando</span></div></header>
<main>
  <div class="intro">
    <p class="eyebrow">INVENTARIO AUDIOVISUAL</p>
    <h1 id="heading">Discos W Agencia</h1>
    <p id="summary">Organiza y encuentra el material de tu equipo.</p>
  </div>
  <div id="search-panel" class="toolbar" hidden>
    <label class="search"><span class="sr">Buscar en el inventario</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Buscar discos o carpetas" maxlength="120"></label>
    <button id="view-picks" type="button" aria-haspopup="dialog">Ver lista (0)</button>
  </div>
  <nav id="path" aria-label="Ubicación" hidden></nav>
  <div class="section"><h2 id="section-title">Tus discos</h2><span id="count"></span></div>
  <div id="list"></div>
  <div id="folder-composer" hidden>
    <button id="folder-add" class="primary" type="button" aria-label="Nueva carpeta en esta ubicación" disabled>+</button>
    <form id="folder-form" hidden>
      <input id="folder-name" aria-label="Nombre de la carpeta" placeholder="Nombre de la carpeta" maxlength="120" autocomplete="off" enterkeyhint="done" required>
      <button id="folder-save" class="primary" type="submit">OK</button>
      <button id="folder-cancel" type="button" aria-label="Cerrar creación de carpetas">×</button>
    </form>
    <p id="folder-error" role="alert" hidden></p>
  </div>
  <p id="notice" role="status"></p>
</main>
<nav class="dock" aria-label="Acciones del inventario">
  <button id="dock-home" type="button" aria-label="Inicio" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
  </button>
  <button id="dock-search" type="button" aria-label="Buscar" aria-controls="search-panel" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
  </button>
  <button id="add" class="primary" type="button" aria-label="Nuevo disco" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</nav>
<dialog aria-labelledby="dialog-title">
  <form id="editor">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="Cerrar">×</button></div>
    <div id="fields"></div>
    <p id="error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" id="cancel">Cancelar</button><button class="primary" id="export-picks" type="button" hidden>Exportar PDF</button><button class="primary" id="save" type="submit">Guardar</button></div>
  </form>
</dialog>
</body>
</html>
